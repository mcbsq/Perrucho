<!DOCTYPE html>
<html lang="es-MX">
  <head>
    <meta charset="utf-8" />

    <!-- ── Favicon / iconos ── -->
    <link rel="icon" type="image/png" href="%PUBLIC_URL%/logo.png" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />

    <!-- ── Viewport / tema ── -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#185FA5" />

    <!-- ── SEO básico ──
         Este shell es único para toda la SPA (no hay react-helmet ni nada
         que lo cambie por ruta), así que lleva la marca de PLATAFORMA
         (Emporio) en vez de la de un negocio en particular — antes tenía
         codificado a Taylor's, lo cual era incorrecto incluso para la
         propia landing de la plataforma. -->
    <title>Emporio | Sistema para negocios de servicios</title>
    <meta
      name="description"
      content="Emporio: agenda, punto de venta, inventario y clientes para tu negocio de servicios — con tu propia página para que tus clientes reserven solos."
    />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="Emporio" />
    <link rel="canonical" href="https://perrucho.vercel.app/" />

    <!-- ── Open Graph (WhatsApp, Facebook, etc.) ── -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Emporio" />
    <meta property="og:title" content="Emporio | Sistema para negocios de servicios" />
    <meta
      property="og:description"
      content="Agenda, punto de venta, inventario y clientes — todo en un solo panel."
    />
    <meta property="og:image" content="%PUBLIC_URL%/logo.png" />
    <meta property="og:url" content="https://perrucho.vercel.app/" />
    <meta property="og:locale" content="es_MX" />

    <!-- ── Twitter Card ── -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Emporio" />
    <meta
      name="twitter:description"
      content="Agenda, punto de venta, inventario y clientes — todo en un solo panel."
    />
    <meta name="twitter:image" content="%PUBLIC_URL%/logo.png" />

    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.
    -->
  </head>
  <body>
    <noscript>Necesitas habilitar JavaScript para usar esta aplicación.</noscript>
    <div id="root"></div>
  </body>
</html>
