services:
  emporio:
    build:
      context: .
    env_file:
      - .env
    environment:
      PORT: 3000
      SERVE_STATIC: "true"
    ports:
      - "${EMPORIO_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
